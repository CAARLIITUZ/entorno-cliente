<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let min =1;
        let max =6;
        let resultado;

    

    function LanzarDado(){
        
        resultado = Math.floor(Math.random() * max) + min;
        document.getElementsByTagName("textarea")[0].value = resultado;

        
    }
    </script>
</head>
<body>
    <h1>EJERCICIO PARA GENERAR NUMERO RANDOM ENTRE 1 Y 6</h1>

    <h3>TIRAR DADO</h3>
    
    <textarea rows="6" cols="45"></textarea>

    <button onclick="LanzarDado()">LANZAR</button>
    <br><br>

</body>
</html>
