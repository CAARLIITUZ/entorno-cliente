<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function identificador (caja){
            alert(caja.name);
            alert(caja.value);
            console.log(document.getElementsByName("consulta").length);
            console.log(document.getElementsByName("consulta")[0].value);
            console.log(document.getElementsByName("consulta")[1].value);
            console.log(document.getElementsByName("consulta")[2].value);
            console.log(document.getElementsByName("consulta")[3].value);
            console.log(document.getElementsByName("consulta")[4].value);
        }
    </script>
</head>
<body>
    <label for="">Nombre:</label><input type="text" value="0" name="consulta" onchange="identificador(this)"><br>
    <label for="">Apellidos:</label><input type="text" value="1" name="consulta" onchange="identificador(this)"><br>
    <label for="">DNI:</label><input type="text" value="2" name="consulta" onchange="identificador(this)"><br>
    <label for="">Mail:</label><input type="text" value="3" name="consulta" onchange="identificador(this)"><br>
    <label for="">Fecha:</label><input type="text" value="4" name="consulta" onchange="identificador(this)"><br>
    
</body>
</html>
