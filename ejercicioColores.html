<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        var ListaColores = ["Rojo", "Azul", "Verde", "Morado", "Rosa", 
                            "Amarillo", "Negro", "Marrón", "Blanco", "Naranja"];

        function mostrarListaColores() {
            ListaColores.forEach((color, indice) => {
                document.getElementsByTagName("textarea")[0].value += color + "\n";
            });
        }

        function mostrarListaColores2() {
            for (var i=0; i<ListaColores.length; i++){
                document.getElementsByTagName("textarea")[0].value += ListaColores[i] + "\n";

            }
        }
    </script>
</head>

<body>
    <h3>MOSTREMOS LISTA DE COLORES</h3>

    <input type="button" value="Mostrar colores" onclick="mostrarListaColores2()">
    <br><br>

    <textarea rows="10" cols="30"></textarea>
</body>
</html>
