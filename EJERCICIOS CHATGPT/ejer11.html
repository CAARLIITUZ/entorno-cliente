<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11 - Longitud</title>
    <script>
        // ESCRIBE AQUÍ TU JAVASCRIPT
        function validarCodigo(){
            var codigo = document.getElementsByTagName("input")[0].value;
            var longitudCodigo = codigo.length;

            if (longitudCodigo === 3){
                document.getElementById("resultado").textContent ="CODIGO DE 3 CARACTERES CORRECTO";

            }else{
                alert("ERROR, DEBE SER 3 CARACTERES");
                document.getElementById("resultado").textContent ="";
            }
        }


    </script>
</head>
<body>
    <h2>Validar código</h2>

    <label>Código de tres caracteres:</label>
    <input type="text" id="codigo" onchange="validarCodigo()">

    <p id="resultado"></p>
</body>
</html>
