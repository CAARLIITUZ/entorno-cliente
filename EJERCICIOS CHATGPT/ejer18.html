<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 18 - Calculadora</title>
    <script>
        // ESCRIBE AQUÍ TU JAVASCRIP

        function calcular (){
            let valor1 = document.getElementById("num1").value;
            let operador = document.getElementById("operacion").value;
            let valor2 = document.getElementById("num2").value;

            valor1 = Number(valor1);
            valor2 = Number(valor2);
            let resultado;

            switch(operador){
                case "+":
                    resultado = valor1+valor2;
                    document.getElementById("resultado").value = "Resultado "+ resultado;
                break;

                case "-":
                    resultado = valor1-valor2;
                    document.getElementById("resultado").value = "Resultado "+ resultado;
                break;

                case "*":
                    resultado = valor1*valor2;
                    document.getElementById("resultado").value = "Resultado "+ resultado;
                break;

                case "/":
                    if (valor2 ===0){
                        document.getElementById("resultado").value = "NO SE PUEDE DIVIDIR POR CERO";
                    }else{
                    resultado = valor1/valor2;
                    document.getElementById("resultado").value = "Resultado "+ resultado;
                    }
                break;

                default:
                    document.getElementById("resultado").value = "NI IDEA DE ESE OPERADOR";
            }
        }


    </script>
</head>
<body>
    <h2>Calculadora</h2>

    <label>Primer número:</label>
    <input type="text" id="num1">

    <br><br>

    <label>Operación (+, -, *, /):</label>
    <input type="text" id="operacion">

    <br><br>

    <label>Segundo número:</label>
    <input type="text" id="num2">

    <br><br>

    <button onclick="calcular()">Calcular</button>

    <br><br>
    <textarea id="resultado" rows="5" cols="40"></textarea>
</body>
</html>
